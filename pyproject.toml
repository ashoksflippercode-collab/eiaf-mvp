[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eiaf"
version = "1.0.0"
description = "Enterprise Information Access Framework (EIAF) — MVP Foundation"
requires-python = ">=3.11"
authors = [{ name = "Sandeep Kumar Mishra" }]
readme = "README.md"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
# Repo root on sys.path so `import backend.*` resolves without an editable install.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"
