# Semantic entity definition (PRD §3 Layer 4).
#
# This layer knows ONLY business concepts — entities, metrics, dimensions, and
# allowed filters. It contains ZERO SQL and ZERO physical column names.
# Adding a metric or filter here (plus a schema_registry mapping) is how the
# system gains capability without touching Intent / Orchestration / Service code.
entity: sales

metrics:
  - total_sales
  - avg_purchase
  - orders

# Allowed filter values per dimension. The Semantic Layer rejects anything not
# declared here with SEMANTIC_VALIDATION_FAILED before it can reach the DB.
filters:
  period:
    - today
    - this_week
    - this_month
  customer_name: []
  product: []
  purchase_amount: []
  purchase_date: []
