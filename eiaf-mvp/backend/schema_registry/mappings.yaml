# Schema Registry (PRD §4) — the SINGLE source of truth mapping business
# concepts to physical database structure (rusty_maintenance schema).
#
# CODE-REVIEW RULE (§4): no physical table/column name may appear anywhere
# outside this file and the Data Layer.
#
# EXTENSION (maintenance domain): metrics/dimensions can now live on a table
# OTHER than the entity's base table. When that happens, the Data Layer joins
# to it using an edge declared in the top-level `joins:` list below. Each edge
# is undirected (it can be walked from either side) so it is reusable across
# entities.
version: 2

# --- Join graph --------------------------------------------------------------
# left_table.left_column = right_table.right_column
# The Data Layer does a simple breadth-first walk over this list to connect
# whichever tables a given query actually touches — declare an edge once here
# and every entity/metric/dimension that needs that relationship can use it.
joins:
  - left_table: torque_calibration_wrenches
    left_column: submission_id
    right_table: torque_calibration_submissions
    right_column: id
  - left_table: equipment_maintenance_checks
    left_column: submission_id
    right_table: equipment_maintenance_submissions
    right_column: id
  - left_table: equipment_maintenance_checks
    left_column: check_item_id
    right_table: equipment_check_items
    right_column: id
  - left_table: facility_maintenance_log_tasks
    left_column: log_id
    right_table: facility_maintenance_logs
    right_column: id
  - left_table: facility_maintenance_log_tasks
    left_column: task_id
    right_table: facility_maintenance_tasks
    right_column: id

# --- Per-entity base table & period column -----------------------------------
# Declares, for each semantic entity, which physical table is the query's
# starting point (the Data Layer joins outward from here using the `joins:`
# graph above), and which table+column a `period` filter constrains.
base_tables:
  stores: stores
  employees: rosters
  torque_calibration: torque_calibration_wrenches
  equipment_issues: equipment_maintenance_checks
  facility_maintenance: facility_maintenance_logs

period_columns:
  torque_calibration:
    table: torque_calibration_submissions
    column: submitted_at
  equipment_issues:
    table: equipment_maintenance_submissions
    column: submitted_at
  facility_maintenance:
    table: facility_maintenance_logs
    column: date_completed

# --- Business metric -> how to compute it physically --------------------------
# `aggregation` is whitelisted in the Data Layer (SUM/COUNT/AVG/MIN/MAX).
metrics:
  store_count:
    table: stores
    column: id
    aggregation: COUNT

  employee_count:
    table: rosters
    column: id
    aggregation: COUNT

  failed_calibration_count:
    table: torque_calibration_wrenches
    column: id
    aggregation: COUNT

  calibration_submission_count:
    table: torque_calibration_submissions
    column: id
    aggregation: COUNT

  issue_count:
    table: equipment_maintenance_checks
    column: id
    aggregation: COUNT

  facility_log_count:
    table: facility_maintenance_logs
    column: id
    aggregation: COUNT

  # Special strategy: stores with NO matching row in `join_table` within the
  # period window. The Data Layer handles `strategy: anti_join` as a dedicated
  # code path (a NOT IN subquery) rather than the generic select/group builder,
  # because "absence of a row" cannot be expressed as a plain aggregation.
  stores_not_submitted_torque:
    strategy: anti_join
    base_table: stores
    base_id_column: store_id
    join_table: torque_calibration_submissions
    join_column: store_id
    date_column: submitted_at

# --- Filter/select dimension -> the physical column it constrains -------------
dimensions:
  # generic period dimension fallback (used when a metric doesn't override
  # date_column above)
  period:
    table: stores
    column: date_created
    type: date

  # stores
  store_id:
    table: stores
    column: store_id
    type: numeric
  store_name:
    table: stores
    column: store_name
    type: string
  store_address:
    table: stores
    column: address
    type: string
  store_city:
    table: stores
    column: city
    type: string
  store_phone:
    table: stores
    column: store_phone
    type: string
  store_email:
    table: stores
    column: store_email
    type: string
  manager_name:
    table: stores
    column: manager_name
    type: string
  manager_email:
    table: stores
    column: manager_email
    type: string
  is_active:
    table: stores
    column: is_active
    type: string

  # rosters / employees
  emp_id:
    table: rosters
    column: emp_id
    type: string
  first_name:
    table: rosters
    column: first_name
    type: string
  last_name:
    table: rosters
    column: last_name
    type: string
  job_code:
    table: rosters
    column: job_code
    type: string
  employee_status:
    table: rosters
    column: status
    type: numeric
  employee_phone:
    table: rosters
    column: phone
    type: string
  is_trainer:
    table: rosters
    column: is_trainer
    type: numeric
  roster_store_id:
    table: rosters
    column: store_id
    type: numeric

  # torque calibration (wrench-level, joined to submission for store/date)
  calibration_store_id:
    table: torque_calibration_submissions
    column: store_id
    type: string
  calibration_tech:
    table: torque_calibration_submissions
    column: calibration_tech
    type: string
  calibration_submitted_at:
    table: torque_calibration_submissions
    column: submitted_at
    type: date
  wrench_serial_number:
    table: torque_calibration_wrenches
    column: serial_number
    type: string
  wrench_torque_reading:
    table: torque_calibration_wrenches
    column: torque_reading
    type: string
  wrench_result:
    table: torque_calibration_wrenches
    column: result
    type: string

  # equipment maintenance checks (joined to submission + check item)
  equipment_store_id:
    table: equipment_maintenance_submissions
    column: store_id
    type: string
  equipment_frequency:
    table: equipment_maintenance_submissions
    column: frequency
    type: string
  equipment_technician:
    table: equipment_maintenance_submissions
    column: technician
    type: string
  equipment_submitted_at:
    table: equipment_maintenance_submissions
    column: submitted_at
    type: date
  equipment_name:
    table: equipment_check_items
    column: equipment
    type: string
  check_name:
    table: equipment_check_items
    column: check_name
    type: string
  check_status:
    table: equipment_maintenance_checks
    column: status
    type: string
  issue_description:
    table: equipment_maintenance_checks
    column: issue_description
    type: string

  # facility maintenance
  facility_store_id:
    table: facility_maintenance_logs
    column: store_id
    type: string
  facility_date_completed:
    table: facility_maintenance_logs
    column: date_completed
    type: date
  facility_service_provider:
    table: facility_maintenance_logs
    column: service_provider
    type: string
  facility_notes:
    table: facility_maintenance_logs
    column: notes
    type: string
